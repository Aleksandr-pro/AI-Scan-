name: Snow footprints
on:
  push:
    paths:
      - 'minecraft/snow-footprints/**'
      - 'minecraft/snow-footprints.mcaddon'
      - 'minecraft/tools/*snow_footprint*'
      - '.github/workflows/snow-footprints.yml'
  pull_request:
    paths:
      - 'minecraft/snow-footprints/**'
      - 'minecraft/snow-footprints.mcaddon'
      - 'minecraft/tools/*snow_footprint*'
      - '.github/workflows/snow-footprints.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 minecraft/tools/test_snow_footprints.py -v
