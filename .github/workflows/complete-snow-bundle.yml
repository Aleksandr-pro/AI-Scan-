name: Combined texture pack and snow footprints
on:
  push:
    paths:
      - 'minecraft/realistic-dirt.mcpack'
      - 'minecraft/snow-footprints.mcaddon'
      - 'minecraft/realistic-snow-complete.mcaddon'
      - 'minecraft/tools/build_complete_snow_bundle.py'
      - 'minecraft/tools/test_complete_snow_bundle.py'
      - 'minecraft/tools/prepare_ice_bundle_optimizations.py'
      - 'minecraft/tools/prepare_ordinary_ice.py'
      - 'minecraft/tools/test_ordinary_ice.py'
      - 'minecraft/ice-reference/**'
      - 'minecraft/ice-bundle-optimized/**'
      - '.github/workflows/complete-snow-bundle.yml'
  pull_request:
    paths:
      - 'minecraft/realistic-dirt.mcpack'
      - 'minecraft/snow-footprints.mcaddon'
      - 'minecraft/realistic-snow-complete.mcaddon'
      - 'minecraft/tools/build_complete_snow_bundle.py'
      - 'minecraft/tools/test_complete_snow_bundle.py'
      - 'minecraft/tools/prepare_ice_bundle_optimizations.py'
      - 'minecraft/tools/prepare_ordinary_ice.py'
      - 'minecraft/tools/test_ordinary_ice.py'
      - 'minecraft/ice-reference/**'
      - 'minecraft/ice-bundle-optimized/**'
      - '.github/workflows/complete-snow-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==13.0.0
      - run: python minecraft/tools/test_complete_snow_bundle.py -v
      - run: python minecraft/tools/test_ordinary_ice.py -v
